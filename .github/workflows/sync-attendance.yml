name: Sync Attendance

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch attendance from Royal usage sheet
        env:
          ROYAL_URL: ${{ secrets.ROYAL_URL }}
          ROYAL_PASS: ${{ secrets.ROYAL_PASS }}
        run: python3 scripts/fetch_attendance.py

      - name: Commit attend.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add attend.json
          git diff --staged --quiet || git commit -m "Update attendance data [skip ci]"
          git pull --rebase origin main
          git push
